<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jellyfin Home Theater</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      border: 1px solid #2a2a2a;
    }
    .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin-bottom: 12px;
    }
    .logo-circle {
      width: 52px; height: 52px; background: #e5a00d;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .logo h1 {
      font-size: 28px; font-weight: 800; letter-spacing: 2px;
      color: #fff;
    }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; }
    .btn-row { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: block; padding: 18px 32px;
      border-radius: 12px; text-decoration: none;
      font-size: 17px; font-weight: 600;
      transition: all 0.2s;
      cursor: pointer; border: none;
    }
    .btn-tv {
      background: #e5a00d; color: #000;
    }
    .btn-tv:hover { background: #f5b51d; transform: translateY(-2px); }
    .btn-remote {
      background: transparent; color: #e5a00d;
      border: 2px solid #e5a00d;
    }
    .btn-remote:hover { background: #e5a00d22; transform: translateY(-2px); }
    .tip { margin-top: 28px; color: #555; font-size: 12px; line-height: 1.7; }
    .tip code { color: #e5a00d; background: #2a2a2a; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-circle">🎬</div>
      <h1>JELLYFIN</h1>
    </div>
    <p class="subtitle">Home Theater — Custom Smart TV Interface</p>
    <div class="btn-row">
      <a href="/tv" class="btn btn-tv">📺 Open TV Display</a>
      <a href="/remote" class="btn btn-remote">📱 Open Phone Remote</a>
    </div>
    <p class="tip">
      Open <code>/tv</code> on your HDMI-connected display in fullscreen.<br>
      Open <code>/remote</code> on your phone to control it.<br>
      Both must be on the same Wi-Fi network.
    </p>
  </div>
</body>
</html>
